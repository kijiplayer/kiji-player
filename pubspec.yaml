name: kiji_player
description: "Free, open-source music player for Android and Windows. No ads, no payments, no tracking."
publish_to: 'none'

# La escribe tool/version.dart (versión + número de compilación).
version: 0.6.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Registra los canales nativos de Kiji también en el motor del servicio de audio (sin pantalla).
  kiji_channels:
    path: packages/kiji_channels
  # Textos de la app en archivos ARB: español base, inglés listo para traducir.
  flutter_localizations:
    sdk: flutter
  intl: any

  # Estado y red.
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  connectivity_plus: ^7.3.2

  # Audio: reproducción, sesión, notificación y PC (media_kit).
  just_audio: ^0.10.6
  audio_session: ^0.1.21
  audio_service: ^0.18.19
  just_audio_media_kit: ^2.1.0
  # Ya venía con just_audio_media_kit: se usa directo para analizar el volumen en la PC (onda en vivo).
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1

  # Biblioteca local y archivos.
  on_audio_query: ^2.9.0
  audio_metadata_reader: ^1.8.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  archive: ^4.5.2
  sqlite3: ^3.7.1
  ffi: ^2.2.0

  # Solver y PO token de YouTube, inicio de sesión y traducción en el teléfono.
  flutter_inappwebview: ^6.2.0-beta.3
  crypto: ^3.0.7

  # Compartir, abrir enlaces y fotos personalizadas.
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  crop_your_image: ^2.0.1
  image: ^4.12.0

  # PC: cerrar la ventana en orden (y, desde la 0.7.0, la bandeja del sistema).
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Recorrido de la app en la PC con una carpeta de datos temporal.
  path_provider_platform_interface: ^2.1.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Créditos que se muestran en Configuración → Acerca de.
    - CREDITS.md
    # Solver de yt-dlp/ejs para descifrar el audio de YouTube.
    - assets/solver/
    # Traducción en el teléfono: pegamento JS de Bergamot, de Firefox (MPL-2.0).
    - assets/translation/
    # Las 5 notas de Kiji (bienvenida); se generan con tool/make_kiji_notes.py.
    - assets/sounds/kiji_notes.wav
    # Ícono de la bandeja del sistema (PC).
    - assets/tray/
    # "Novedades de esta versión": las mismas notas de la tienda de apps (una por compilación).
    - fastlane/metadata/android/es-ES/changelogs/
    - fastlane/metadata/android/en-US/changelogs/

  # Kiji Nocturne. Tipografías incluidas en la app (licencia OFL, ver los OFL.txt):
  # no se descargan de Google al usarla, así nada sale del teléfono sin pedirlo.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
    # Estilos Grafito y Papel (incluidas en la app, OFL; nunca se descargan).
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader-Variable.ttf

# Ícono de la app, generado desde assets/branding/kiji_logo.svg (ver tool/render_logo.dart).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/kiji_logo_1024.png"
  adaptive_icon_background: "#0B0B14"
  adaptive_icon_foreground: "assets/branding/kiji_logo_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/branding/kiji_logo_1024.png"
    icon_size: 256
