# Análisis, pruebas y compilación de Android y Windows en cada subida a master y en cada PR.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analizar-y-probar:
    name: Análisis y pruebas (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis
        run: flutter analyze
      - name: Pruebas
        run: flutter test

  android:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Parche de plugins viejos
        run: dart run tool/patch_plugins.dart
      - name: "NDK de Android (con reintentos: la descarga a veces llega dañada)"
        run: |
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          ndk=${ndk:-28.2.13676358}
          echo "NDK $ndk"
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$ndk"
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null; then exit 0; fi
            echo "::warning::Falló la descarga de la NDK (intento $i)."
            sleep 20
          done
          exit 1
      # Sin la clave release (no hace falta para comprobar que compila): firma de depuración.
      - name: APK release (Kiji)
        run: flutter build apk --release --flavor prod
      - name: APK de Kiji Dev
        run: flutter build apk --debug --flavor dev

  windows:
    name: Compilar Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Windows release
        run: flutter build windows --release
