# Análisis, pruebas y compilación de Android, Windows y Linux en cada subida a master y en cada PR.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analizar-y-probar:
    name: Análisis y pruebas (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis
        run: flutter analyze
      - name: Pruebas
        run: flutter test

  android:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: "NDK de Android (con reintentos: la descarga a veces llega dañada)"
        run: |
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          ndk=${ndk:-28.2.13676358}
          echo "NDK $ndk"
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$ndk"
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null; then exit 0; fi
            echo "::warning::Falló la descarga de la NDK (intento $i)."
            sleep 20
          done
          exit 1
      # Sin la clave release (no hace falta para comprobar que compila): firma de depuración.
      - name: APK release (Kiji)
        run: flutter build apk --release --flavor prod
      - name: APK de Kiji Dev
        run: flutter build apk --debug --flavor dev

  windows:
    name: Compilar Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Windows release
        run: flutter build windows --release

  linux:
    name: Compilar Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Librerías del sistema (GTK, mpv, WebKit WPE, bandeja y atajos)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev libepoxy-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
          # WebKit WPE (el visor web del solucionador de YouTube): el nombre cambia según la versión
          # de Ubuntu; se instala el primero que exista.
          apt-cache search --names-only 'wpe' | grep -i dev || true
          for pkg in libwpewebkit-2.0-dev libwpewebkit-1.1-dev libwpewebkit-1.0-dev; do
            if sudo apt-get install -y "$pkg"; then echo "WPE: $pkg"; break; fi
          done
          for pkg in libwpe-platform-2.0-dev libwpebackend-fdo-1.0-dev; do
            sudo apt-get install -y "$pkg" && echo "WPE backend: $pkg" || true
          done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Linux release
        run: flutter build linux --release
