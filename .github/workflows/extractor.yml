# Prueba diaria del extractor contra YouTube real (test_live/extractor_live_test.dart).
#
# Sin falsas alarmas:
# - "bloqueo": YouTube pide "confirmar que no eres un bot" a los servidores de GitHub. Desde acá no
#   se puede saber si Kiji anda: la corrida queda en verde con un aviso y no cuenta.
# - "falla": cualquier otro problema. Se cuentan los días seguidos (el estado pasa de una corrida a
#   la siguiente en el artefacto "estado-extractor"). Al TERCER día seguido se abre un issue (o se
#   comenta el que ya está abierto) y la corrida queda en rojo; antes, verde con un aviso.
# - "ok": se reinicia la cuenta y, si había un issue abierto, se cierra.
# Desde una PC (IP de casa), `dart run tool/extractor_pc.dart` abre el issue en el acto si falla.
# Qué hacer cuando falla: docs/EXTRACTOR.md.
name: Prueba diaria del extractor

on:
  schedule:
    - cron: '17 9 * * *' # todos los días, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

env:
  FLUTTER_VERSION: '3.47.0'
  TITULO: 'Prueba diaria del extractor: YouTube no da el audio'
  DIAS_PARA_AVISAR: 3

jobs:
  extractor:
    name: Extractor contra YouTube real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Prueba en vivo
        continue-on-error: true
        run: flutter test test_live/extractor_live_test.dart

      - name: Días seguidos con falla real
        id: estado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resultado=$(jq -r '.resultado' build/extractor_live.json 2>/dev/null || echo falla)
          # Estado de la corrida anterior (si hay).
          antes=0
          previa=$(gh run list --workflow extractor.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$previa" ] && gh run download "$previa" --name estado-extractor --dir previo 2>/dev/null; then
            antes=$(jq -r '.seguidas // 0' previo/estado.json)
          fi
          case "$resultado" in
            ok) seguidas=0 ;;
            bloqueo) seguidas=$antes ;;
            *) seguidas=$((antes + 1)) ;;
          esac
          echo "Resultado: $resultado · días seguidos con falla real: $seguidas (antes: $antes)"
          mkdir -p estado
          jq -n --arg r "$resultado" --argjson s "$seguidas" --arg f "$(date -u +%Y-%m-%d)" \
            '{resultado: $r, seguidas: $s, fecha: $f}' > estado/estado.json
          echo "resultado=$resultado" >> "$GITHUB_OUTPUT"
          echo "seguidas=$seguidas" >> "$GITHUB_OUTPUT"
          if [ "$resultado" = falla ] && [ "$seguidas" -ge "$DIAS_PARA_AVISAR" ]; then avisar=true; else avisar=false; fi
          echo "avisar=$avisar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: estado-extractor
          path: estado/estado.json
          retention-days: 30

      - name: Resumen
        run: |
          if [ -f build/extractor_live.md ]; then cat build/extractor_live.md >> "$GITHUB_STEP_SUMMARY"; fi
          {
            echo
            echo "Días seguidos con falla real: ${{ steps.estado.outputs.seguidas }} (se avisa a los $DIAS_PARA_AVISAR)."
          } >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.estado.outputs.resultado }}" in
            bloqueo) echo "::warning::YouTube pide 'no eres un bot' a los servidores de GitHub: no se puede probar desde acá. No cuenta como falla (desde una PC: dart run tool/extractor_pc.dart)." ;;
            falla) echo "::warning::Falla real (día ${{ steps.estado.outputs.seguidas }} de $DIAS_PARA_AVISAR antes de abrir un issue)." ;;
          esac

      - name: Abrir o comentar el issue (falla real varios días seguidos)
        if: steps.estado.outputs.avisar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create extractor --color D93F0B --description "Extractor de YouTube" --force
          gh label create error --color B60205 --description "Algo no funciona" --force
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "La prueba diaria del extractor falla hace ${{ steps.estado.outputs.seguidas }} días seguidos ([última corrida]($run))."
            echo
            cat build/extractor_live.md 2>/dev/null || echo "La prueba no llegó a escribir el resumen."
            echo
            echo "Qué hacer: [docs/EXTRACTOR.md](../blob/master/docs/EXTRACTOR.md) → \"Diagnóstico paso a paso\"."
          } > cuerpo.md
          numero=$(gh issue list --state open --label extractor --search "in:title \"$TITULO\"" --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file cuerpo.md
          else
            gh issue create --title "$TITULO" --label extractor --label error --body-file cuerpo.md
          fi
          exit 1

      - name: Cerrar el issue si volvió a andar
        if: steps.estado.outputs.resultado == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --state open --label extractor --search "in:title \"$TITULO\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$numero" ]; then
            gh issue close "$numero" --comment "La prueba diaria volvió a pasar el $(date -u +%Y-%m-%d)."
          fi
